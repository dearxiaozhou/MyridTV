name: Build Windows Installer

on:
  # 手动触发（推荐日常出包）：可在 GitHub 网页上点 Run workflow，勾选是否签名
  workflow_dispatch:
    inputs:
      sign:
        description: "对安装包进行代码签名（需要仓库 Secrets 已配置证书）"
        type: boolean
        default: false
  # 打 tag 时自动出正式包并挂 Release，例如 git tag V0.3.11 && git push --tags
  push:
    branches:
      - main
    tags:
      - "v*"
      - "V*"
  # 每个 PR 都跑一遍自检，红绿直接显示在 PR 页面上。
  # 只跑 verify job，不出安装包 —— 出包要 3 分钟，没必要为每个 PR 浪费。
  pull_request:
    branches:
      - main

permissions:
  # 默认最小权限；只有真正要发 Release 的 build job 才提升到 write
  contents: read

jobs:
  # ── 自检：语法 / i18n / 悬空名字 / 前端接线 / 单测 ────────────────
  # PR、push main、打 tag、手动触发都会跑。红了就别往下走。
  verify:
    name: Self-check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自检要跑 Python 单测。node 用 runner 自带的（verify.ps1 也用它查 JS 语法）。
      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install self-check dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets ecdsa cryptography

      - name: Self-check (verify)
        shell: pwsh
        env:
          MYRIDTV_PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
          MYRIDTV_SKIP_E2E: "1"
        run: |
          & .\tests\verify.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::自检未通过，终止"
            exit $LASTEXITCODE
          }

      # Keep the legacy full local suite separate; this portable UI baseline
      # is mandatory on PRs, main, tags and manual releases.
      - name: Install UI baseline browser
        shell: pwsh
        run: |
          python -m pip install playwright==1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UI baseline (isolated, no generation)
        shell: pwsh
        env:
          MYRIDTV_PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
          MYRIDTV_UI_ARTIFACTS: _verification/ui-baseline
        run: |
          & .\tests\run_regression.ps1 -Only ui_baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\run_regression.ps1 -Only generation_lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\tests\verify_canvas_overwrite.py
          exit $LASTEXITCODE

      - name: Preserve UI baseline evidence
        # 2026-10-20：GitHub Actions artifact 配额爆（池实为空、等 GH 重算），上传必失败纯刷红叉；
        # 发布链路走 GitHub Release + MyridTV-updates 仓，不依赖 artifact。配额恢复后删掉下一行
        # if: false 即可恢复上传。
        if: false # disabled 2026-10-20: artifact storage quota hit
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-baseline
          path: |
            _verification/ui-baseline/
            _verification/generation-lifecycle/
            _verification/overwrite/
          if-no-files-found: warn
          retention-days: 14

  # ── 打包：只在「手动」或「打 tag」时跑 ──────────────────────────────
  # PR 和普通的 push main 都不会走到这里。
  # needs: verify 保证自检过了才出包。
  build:
    name: Build installer
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    permissions:
      # 打 tag 时要把安装包挂到 Release 上，所以需要写权限
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          )
          if ($candidates | Where-Object { Test-Path $_ }) {
            Write-Host "Inno Setup already present."
          } else {
            Write-Host "Installing Inno Setup via chocolatey..."
            choco install innosetup --no-progress -y
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $display = (Get-Content VERSION -Raw).Trim()
          $numeric = $display.TrimStart('V','v')
          "display=$display"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $display (numeric $numeric)"

      - name: Resolve Python directory
        id: pydir
        shell: pwsh
        run: |
          $exe = '${{ steps.setup-python.outputs.python-path }}'
          $dir = Split-Path -Parent $exe
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "PythonDir: $dir"

      - name: Build installer
        shell: pwsh
        env:
          MYRIDTV_SIGN_CERT_PASSWORD: ${{ secrets.MYRIDTV_SIGN_CERT_PASSWORD }}
        run: |
          $params = @{
            PythonDir = '${{ steps.pydir.outputs.dir }}'
          }
          if ('${{ inputs.sign }}' -eq 'true' -and '${{ secrets.MYRIDTV_SIGN_CERT_PFX }}' -ne '') {
            # 证书以 base64 存在 Secret 里，运行时解码到本地临时文件
            $pfxPath = Join-Path $env:RUNNER_TEMP 'myridtv-code-signing.pfx'
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String('${{ secrets.MYRIDTV_SIGN_CERT_PFX }}'))
            $params['Sign'] = $true
            $params['SignCertPath'] = $pfxPath
            Write-Host "Signing enabled."
          } else {
            Write-Host "Signing disabled (unsigned build)."
          }
          & .\installer\build-installer.ps1 @params
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        # 2026-10-20 同上：artifact 配额爆，上传必失败；正式包走 softprops/action-gh-release，不走 artifact。
        # 配额恢复后删掉下一行 if: false 即可恢复。
        if: false # disabled 2026-10-20: artifact storage quota hit
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MyridTV-Setup-${{ steps.version.outputs.display }}
          path: installer/build/installer/MyridTV-Setup.exe
          if-no-files-found: error
          retention-days: 30

      # Create the signed static delta as a private CI artifact. Public upload is
      # deliberately separate: the public channel must not receive Python source.
      - name: Build signed static update
        shell: pwsh
        env:
          MYRIDTV_UPDATE_SIGNING_KEY: ${{ secrets.MYRIDTV_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:MYRIDTV_UPDATE_SIGNING_KEY) { throw 'Missing update signing key' }
          python -m pip install ecdsa cryptography
          $previous = 'installer/build/previous-update-manifest.json'
          $updateArgs = @('--stage', 'installer/build/MyridTV', '--out', 'installer/build/update-release')
          try {
            Invoke-WebRequest 'https://github.com/dearxiaozhou/MyridTV-updates/releases/latest/download/update-manifest.json' -OutFile $previous -TimeoutSec 15
            $oldVersion = (Get-Content $previous -Raw | ConvertFrom-Json).version
            $newVersion = (Get-Content VERSION -Raw).Trim()
            if ([version]($oldVersion.TrimStart('V','v')) -lt [version]($newVersion.TrimStart('V','v'))) {
              $updateArgs += @('--previous', $previous)
            }
          } catch {
            Write-Host 'No earlier public update manifest; creating the first static baseline.'
          }
          python installer/make-update-release.py @updateArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Publish the signed static delta directly to the public updates repo.
      # GITHUB_TOKEN cannot write to a separate repo, so a PAT with write
      # access to dearxiaozhou/MyridTV-updates is required (secret
      # MYRIDTV_UPDATES_PAT). Going straight to the release avoids the
      # GitHub Actions artifact storage quota entirely. If the PAT is absent
      # the step is a no-op instead of failing the build (manual publish).
      - name: Publish static update to MyridTV-updates
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.MYRIDTV_UPDATES_PAT }}
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { Write-Host 'MYRIDTV_UPDATES_PAT not set; skip public upload.'; exit 0 }
          $V = (Get-Content VERSION -Raw).Trim()
          $rel = "MyridTV static update $V"
          $notes = "Front-end static resources only (html/css/js); no Python source. Unchanged files reuse this Release's URL in later versions. Do not delete."
          $exists = gh release view "$V" -R dearxiaozhou/MyridTV-updates >$null 2>&1
          if (-not $exists) {
            gh release create "$V" -R dearxiaozhou/MyridTV-updates --title $rel --notes $notes --draft
          }
          foreach ($f in Get-ChildItem 'installer/build/update-release/*') {
            gh release upload "$V" "$($f.FullName)" -R dearxiaozhou/MyridTV-updates --clobber
          }
          gh release edit "$V" -R dearxiaozhou/MyridTV-updates --draft=false --title $rel --notes $notes
          Write-Host "Published static update $V to MyridTV-updates"

      # 只有打 tag 才发 Release（手动 Run workflow 只出临时的 Artifact，
      # 避免每次调试都在 Release 列表里堆一堆版本）
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = 'installer/build/installer/MyridTV-Setup.exe'
          $dst = "installer/build/installer/MyridTV-Setup-${{ steps.version.outputs.display }}.exe"
          Copy-Item $src $dst -Force
          Write-Host "Release asset: $dst"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MyridTV ${{ steps.version.outputs.display }}
          files: installer/build/installer/MyridTV-Setup-${{ steps.version.outputs.display }}.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
