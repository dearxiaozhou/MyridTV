name: Build Windows Installer

on:
  # 手动触发（推荐日常出包）：可在 GitHub 网页上点 Run workflow，勾选是否签名
  workflow_dispatch:
    inputs:
      sign:
        description: "对安装包进行代码签名（需要仓库 Secrets 已配置证书）"
        type: boolean
        default: false
  # 打 tag 时自动出正式包并挂 Release，例如 git tag V0.3.11 && git push --tags
  push:
    branches:
      - main
    tags:
      - "v*"
      - "V*"
  # 每个 PR 都跑一遍自检，红绿直接显示在 PR 页面上。
  # 只跑 verify job，不出安装包 —— 出包要 3 分钟，没必要为每个 PR 浪费。
  pull_request:
    branches:
      - main

permissions:
  # 默认最小权限；只有真正要发 Release 的 build job 才提升到 write
  contents: read

jobs:
  # ── 自检：语法 / i18n / 悬空名字 / 单测 ────────────────────────────
  # PR、push main、打 tag、手动触发都会跑。红了就别往下走。
  verify:
    name: Self-check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自检要跑 Python 单测。node 用 runner 自带的（verify.ps1 也用它查 JS 语法）。
      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install self-check dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets

      - name: Self-check (verify)
        shell: pwsh
        env:
          MYRIDTV_PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          & .\tests\verify.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::自检未通过，终止"
            exit $LASTEXITCODE
          }

  # ── 打包：只在「手动」或「打 tag」时跑 ──────────────────────────────
  # PR 和普通的 push main 都不会走到这里。
  # needs: verify 保证自检过了才出包。
  build:
    name: Build installer
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    permissions:
      # 打 tag 时要把安装包挂到 Release 上，所以需要写权限
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          )
          if ($candidates | Where-Object { Test-Path $_ }) {
            Write-Host "Inno Setup already present."
          } else {
            Write-Host "Installing Inno Setup via chocolatey..."
            choco install innosetup --no-progress -y
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $display = (Get-Content VERSION -Raw).Trim()
          $numeric = $display.TrimStart('V','v')
          "display=$display"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric=$numeric"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $display (numeric $numeric)"

      - name: Resolve Python directory
        id: pydir
        shell: pwsh
        run: |
          $exe = '${{ steps.setup-python.outputs.python-path }}'
          $dir = Split-Path -Parent $exe
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "PythonDir: $dir"

      - name: Build installer
        shell: pwsh
        env:
          MYRIDTV_SIGN_CERT_PASSWORD: ${{ secrets.MYRIDTV_SIGN_CERT_PASSWORD }}
        run: |
          $params = @{
            PythonDir = '${{ steps.pydir.outputs.dir }}'
          }
          if ('${{ inputs.sign }}' -eq 'true' -and '${{ secrets.MYRIDTV_SIGN_CERT_PFX }}' -ne '') {
            # 证书以 base64 存在 Secret 里，运行时解码到本地临时文件
            $pfxPath = Join-Path $env:RUNNER_TEMP 'myridtv-code-signing.pfx'
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String('${{ secrets.MYRIDTV_SIGN_CERT_PFX }}'))
            $params['Sign'] = $true
            $params['SignCertPath'] = $pfxPath
            Write-Host "Signing enabled."
          } else {
            Write-Host "Signing disabled (unsigned build)."
          }
          & .\installer\build-installer.ps1 @params
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyridTV-Setup-${{ steps.version.outputs.display }}
          path: installer/build/installer/MyridTV-Setup.exe
          if-no-files-found: error
          retention-days: 30

      # 只有打 tag 才发 Release（手动 Run workflow 只出临时的 Artifact，
      # 避免每次调试都在 Release 列表里堆一堆版本）
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = 'installer/build/installer/MyridTV-Setup.exe'
          $dst = "installer/build/installer/MyridTV-Setup-${{ steps.version.outputs.display }}.exe"
          Copy-Item $src $dst -Force
          Write-Host "Release asset: $dst"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MyridTV ${{ steps.version.outputs.display }}
          files: installer/build/installer/MyridTV-Setup-${{ steps.version.outputs.display }}.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
