      { key: 'menu.settings.api', run: function () { openPagePopup('api-settings'); } },
      { key: 'menu.settings.assets', run: function () { openPagePopup('assets-root'); } },
      { key: 'menu.settings.library', run: function () { openPagePopup('asset-manager'); } },
      { key: 'menu.settings.language', sub: [
        { key: 'menu.settings.language.zh', check: function () { return currentStudioLang() !== 'en'; }, run: function () { tbSetLang('zh'); } },
        { key: 'menu.settings.language.en', check: function () { return currentStudioLang() === 'en'; }, run: function () { tbSetLang('en'); } }
      ]},
      { sep: true },
      { key: 'menu.settings.appearance', sub: (function () {
        var list = window.StudioTheme.list();
        var groups = [ { label: '深色系', mode: 'dark' }, { label: '浅色系', mode: 'light' } ];
        var rows = [];
        groups.forEach(function (g) {
          var themed = list.filter(function (t) { return t.mode === g.mode; });
          if (!themed.length) return;
          rows.push({ group: g.label });
          themed.forEach(function (theme) {
            rows.push({ themeId: theme.id, check: function () { return tbTheme() === theme.id; }, run: function () { tbSetTheme(theme.id); } });
          });
        });
        return rows;
      })() },
      { key: 'menu.settings.homeBg', run: function () { openPagePopup('home-background'); } }
    ]},
    { id: 'workflow', key: 'menu.workflow', items: [
      { key: 'menu.workflow.comfyui', run: function () { openPagePopup('comfyui-settings'); } }
    ]},
    { id: 'help', key: 'menu.help', items: [
      { key: 'menu.help.backend', run: function () { tbShell('menu|backend-url'); } },
      { key: 'menu.help.console', run: function () { toggleTaskConsole(); } },
      { key: 'menu.help.logs', run: function () { tbShell('menu|logs'); } }
    ]},
    { id: 'about', key: 'menu.about', items: [
      { key: 'menu.about.about', run: function () { tbShell('menu|about'); } },
      { key: 'menu.about.update', run: function () { tbShell('menu|update'); } },
      { sep: true },
      { key: 'menu.about.exit', run: function () { tbShell('menu|exit'); } }
    ]}
  ];

  var bar = null, menusHost = null, openId = null, hoverOpened = false, pops = [];

  function tbT(key) {
    var dict = STRINGS[currentStudioLang()] || STRINGS.zh;
    return dict[key] || STRINGS.zh[key] || key;
  }
  function tbTheme() {
    try { return window.StudioTheme && window.StudioTheme.get ? window.StudioTheme.get() : 'dark'; }
    catch (e) { return 'dark'; }
  }
  function tbShell(msg) {
    try { window.chrome.webview.postMessage(msg); } catch (e) { }
  }

  /* ===== 设置类页面弹窗（2026-10-16 老王：所有窗口用弹窗，不挤掉主页面）=====
     菜单项 / 画布内 open-page 都走这里；iframe 加载与舞台iframe 相同的 data-src，
     关闭时卸载（停轮询，下次打开重载取最新配置）。Esc / 点遮罩 / 右上角 × 均可关。 */
  /* 主页背景配置中继：弹窗(外观)改配置后 postMessage 到外壳，外壳转发给画布主页 iframe，
     让主页不必等 storage 事件/轮询也能立刻刷新（WebView2 下 storage 事件跨 iframe 偶发不触发）。 */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'home-bg-config-changed') {
      var cf = document.getElementById('frame-canvas');
      if (cf && cf.contentWindow) { try { cf.contentWindow.postMessage({ type: 'home-bg-config-changed' }, '*'); } catch (err) {} }
    }
  });

  var PAGE_POPUPS = {
    'api-settings': 'menu.settings.api',
    'assets-root': 'menu.settings.assets',
    'asset-manager': 'menu.settings.library',
    'home-background': 'menu.settings.homeBg',
    'comfyui-settings': 'menu.workflow.comfyui'
  };
  var pagePopupOpen = false;

  /* 2026-10-16 修复：顶层 message 处理器（open-page 分支）在 IIFE 外引用这两个名字，
     不挂到 window 会 ReferenceError: PAGE_POPUPS is not defined → 点画布卡片永远进不去。 */
  window.PAGE_POPUPS = PAGE_POPUPS;
  window.openPagePopup = openPagePopup;

  /* 弹窗自适应内容（老王：一点内容别撑个 1360×900 大盒子，还要左右滑）
     宽度：舞台 iframe 上 data-popup-width 声明则用它，否则默认宽；
     高度：读弹窗内容 body 的实际高度收敛（整页型配置页 body=满高，自然还是大窗）。 */
  function fitPopup(pageId) {
    var panel = document.getElementById('tb-page-panel');
    var frame = document.getElementById('tb-page-frame');
    var stage = document.getElementById('frame-' + pageId);
    if (!panel || !frame) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var wantW = stage ? parseInt(stage.dataset.popupWidth || '0', 10) : 0;
    var w = wantW > 0 ? Math.min(wantW, Math.floor(vw * 0.94)) : Math.min(1360, Math.floor(vw * 0.94));
    panel.style.width = w + 'px';
    panel.style.height = Math.floor(vh * 0.9) + 'px';
    var settle = function () {
      var h = 0;
      try {
        var d = frame.contentDocument;
        if (d) {
          if (d.body) h = d.body.scrollHeight;
          if (!h && d.documentElement) h = d.documentElement.scrollHeight;
        }
      } catch (e) { }
      panel.style.height = Math.min(Math.max(h + 41, 200), Math.floor(vh * 0.9)) + 'px';
    };
    requestAnimationFrame(function () { requestAnimationFrame(settle); });
  }

  function openPagePopup(pageId, opts) {
    var key = PAGE_POPUPS[pageId];
    if (!key) return;
    opts = opts || {};
    var stageFrame = document.getElementById('frame-' + pageId);
    var src = opts.src || (stageFrame && (stageFrame.dataset.src || stageFrame.getAttribute('src'))) || '';
    if (!src) return;
    if (opts.tab) {
      var parts = src.split('#')[0].split('?');
      var params = new URLSearchParams(parts[1] || '');
      params.set('tab', opts.tab);
      src = parts[0] + '?' + params.toString();
    }
    var frame = document.getElementById('tb-page-frame');
    if (frame.getAttribute('src') !== src) frame.src = src;
    document.getElementById('tb-page-overlay').classList.add('open');
    document.getElementById('tb-page-panel').classList.add('open');
    pagePopupOpen = true;
    syncThemeToFrame(frame);
    syncLanguageToFrame(frame);
    fitPopup(pageId);
    frame.addEventListener('load', function once() {
      frame.removeEventListener('load', once);
      syncThemeToFrame(frame);
      syncLanguageToFrame(frame);
      fitPopup(pageId);
    });
  }

  function closePagePopup() {
    document.getElementById('tb-page-overlay').classList.remove('open');
    document.getElementById('tb-page-panel').classList.remove('open');
    pagePopupOpen = false;
    var frame = document.getElementById('tb-page-frame');
    if (frame) frame.src = 'about:blank';
  }
  function tbSetTheme(next) {
    try { if (window.StudioTheme && window.StudioTheme.set) window.StudioTheme.set(next); } catch (e) { }
    document.querySelectorAll('iframe').forEach(syncThemeToFrame);
  }
  function tbSetLang(next) {
    try {
      if (window.StudioI18n && window.StudioI18n.set) window.StudioI18n.set(next);
      else localStorage.setItem('studio_lang', next);
      if (window.StudioI18n && window.StudioI18n.apply) window.StudioI18n.apply();
    } catch (e) { }
    if (typeof syncLanguageButton === 'function') syncLanguageButton();
    document.querySelectorAll('iframe').forEach(syncLanguageToFrame);
  }

  function buildPop(items) {
    var pop = document.createElement('div');
    pop.className = 'tb-pop';
    items.forEach(function (item) {
      if (item.group) {
        var gh = document.createElement('div');
        gh.className = 'tb-group';
        gh.textContent = item.group;
        pop.appendChild(gh);
        return;
      }
      if (item.sep) {
        var sep = document.createElement('div');
        sep.className = 'tb-sep';
        pop.appendChild(sep);
        return;
      }
      var row = document.createElement('div');
      row.className = 'tb-item';
      // 勾号行内前缀（不保留固定勾选列）→ 未勾选项的标签贴左，与顶层菜单按钮文字对齐
      if (item.check && item.check()) {
        var check = document.createElement('span');
        check.className = 'tb-check';
        check.textContent = '✓';
        row.appendChild(check);
      }
      var label = document.createElement('span');
      label.className = 'tb-label';
      label.textContent = item.themeId ? window.StudioTheme.name(item.themeId, currentStudioLang()) : tbT(item.key);
      row.appendChild(label);
      if (item.sub) {
        var arrow = document.createElement('span');
        arrow.className = 'tb-arrow';
        arrow.textContent = '▸';
        row.appendChild(arrow);
        var sub = buildPop(item.sub);
        pop.appendChild(sub);
        row.addEventListener('mouseenter', function () {
          pop.querySelectorAll('.tb-pop.open').forEach(function (node) {
            if (node !== sub) node.classList.remove('open');
          });
          sub.classList.add('open');
          sub.style.left = (pop.clientWidth - 5) + 'px';
          sub.style.top = (row.offsetTop - 4) + 'px';
        });
        // 鼠标离开触发行且没进入自身子菜单 → 关闭；离开子菜单且没回到触发行 → 关闭。
        // 标准级联菜单行为，避免悬停离开后下拉一直显示（老王 2026-10-17）。
        row.addEventListener('mouseleave', function (e) {
          var rt = e.relatedTarget;
          if (rt && sub.contains(rt)) return;
          sub.classList.remove('open');
        });
        sub.addEventListener('mouseleave', function (e) {
          var rt = e.relatedTarget;
          if (rt && row.contains(rt)) return;
          sub.classList.remove('open');
        });
      } else {
        row.addEventListener('click', function (ev) {
          ev.stopPropagation();
          closeAll();
          try { item.run(); } catch (e) { }
        });
      }
      pop.appendChild(row);
    });
    return pop;
  }

  function openMenu(id, byHover) {
    var menu = null;
    for (var i = 0; i < MENUS.length; i++) if (MENUS[i].id === id) menu = MENUS[i];
    if (!menu) return;
    closeAll();
    openId = id;
    hoverOpened = !!byHover;
    var btn = menusHost.querySelector('.tb-menu[data-id="' + id + '"]');
    if (btn) btn.classList.add('open');
    var pop = buildPop(menu.items);
    bar.appendChild(pop);
    if (btn) pop.style.left = btn.offsetLeft + 'px';
    pop.classList.add('open');
    pops.push(pop);
    armFrameDismiss();
  }

  function closeAll() {
    openId = null;
    hoverOpened = false;
    disarmFrameDismiss();
    if (menusHost) menusHost.querySelectorAll('.tb-menu.open').forEach(function (n) { n.classList.remove('open'); });
    pops.forEach(function (p) { p.remove(); });
    pops = [];
  }

  /* 2026-10-17 老王：舞台内容是 iframe，iframe 内的 mousedown 不会冒泡到父文档，
     原先只挂 document 的「点菜单/下拉之外收起」对整块舞台失效——在画布上点鼠标菜单不收，
     只有随手点到某个菜单项才关（老王实测）。菜单打开期间给每个舞台 iframe 的 document
     补一个 capture 阶段 mousedown：一点就 closeAll()。页面都由后端 /static 同源服务，
     个别取不到 contentDocument 的（跨域/未挂载）用 try/catch 兜底跳过。 */
  var frameDismiss = [];
  function armFrameDismiss() {
    disarmFrameDismiss();
    document.querySelectorAll('.stage iframe').forEach(function (f) {
      try {
        var doc = f.contentDocument;
        if (!doc) return;
        var h = function () { closeAll(); };
        doc.addEventListener('mousedown', h, true);
        frameDismiss.push({ doc: doc, h: h });
      } catch (e) { }
    });
  }
  function disarmFrameDismiss() {
    frameDismiss.forEach(function (b) {
      try { b.doc.removeEventListener('mousedown', b.h, true); } catch (e) { }
    });
    frameDismiss = [];
  }

  function renderLabels() {
    if (!menusHost) return;
    menusHost.querySelectorAll('.tb-menu').forEach(function (btn) {
      for (var i = 0; i < MENUS.length; i++) {
        if (MENUS[i].id === btn.dataset.id) { btn.textContent = tbT(MENUS[i].key); break; }
      }
    });
    var btnMin = document.getElementById('tb-btn-min');
    var btnMax = document.getElementById('tb-btn-max');
    var btnClose = document.getElementById('tb-btn-close');
    if (btnMin) btnMin.title = tbT('win.min');
    if (btnMax) btnMax.title = (btnMax.dataset.max === '1') ? tbT('win.restore') : tbT('win.max');
    if (btnClose) btnClose.title = tbT('win.close');
  }

  // 壳层在窗口最大化/还原时回调（WM_SIZE 状态变化），切换最大化按钮字形
  window.__tbSyncWinState = function (maximized) {
    var btnMax = document.getElementById('tb-btn-max');
    if (!btnMax) return;
    btnMax.dataset.max = maximized ? '1' : '0';
    btnMax.title = maximized ? tbT('win.restore') : tbT('win.max');
  };

  function init() {
    bar = document.getElementById('tb-bar');
    menusHost = document.getElementById('tb-menus');
    if (!bar || !menusHost) return;
    MENUS.forEach(function (menu) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tb-menu';
      btn.dataset.id = menu.id;
      btn.textContent = tbT(menu.key);
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        // hoverOpened：菜单是被 mouseenter 抢先切换开的。此时点击应「保持打开」
        // （标准菜单栏语义：点击换菜单=打开该菜单，而不是把它关掉），再点一次才收。
        if (openId === menu.id && !hoverOpened) closeAll(); else openMenu(menu.id, false);
      });
      btn.addEventListener('mouseenter', function () {
        if (openId && openId !== menu.id) openMenu(menu.id, true);
      });
      menusHost.appendChild(btn);
    });

    // iframe 换页（src 更换 → contentDocument 换成新文档）后，若菜单仍开着就重新挂 Bridge 监听
    document.querySelectorAll('.stage iframe').forEach(function (f) {
      f.addEventListener('load', function () { if (openId) armFrameDismiss(); });
    });

    // 条带空白区（含图标槽）交互：按住不动=点击；位移超 3px 才向壳发拖动（win|drag），
    // 两次 click 间隔 <400ms 判为双击 → 最大化/还原（win|maximize-toggle）。
    // 不用 DOM dblclick：壳的移动循环会吞掉 mouseup，网页点击流会断（实测 click/dblclick 均不触发）。
    var dragArmed = false, dragSent = false, dragX = 0, dragY = 0, lastBarClick = 0;
    function tbIsChrome(t) {
      return !!(t && t.closest && t.closest('.tb-menu, .tb-pop, .tb-winbtn'));
    }
    /* 2026-10-17 老王：条带上沿补回「拖动缩放窗口」。
       原生标题栏行已被客户区吃进（壳层 WM_NCCALCSIZE），窗口顶部没有可缩放的 NC 区，
       左右下三边仍是原生边框 → 这里只补上边（HTTOP=12）。
       限定：最大化态不缩放；菜单/下拉/窗口按钮区不抢（否则点菜单会变成缩放）；
       只有条带最上 6px 命中（与原生边框厚度同量级，避免误触）。 */
    function tbResizeCode(ev) {
      var btnMaxNow = document.getElementById('tb-btn-max');
      if (btnMaxNow && btnMaxNow.dataset.max === '1') return 0;
      if (tbIsChrome(ev.target)) return 0;
      var rect = bar.getBoundingClientRect();
      if (ev.clientY - rect.top > 6) return 0;
      return 12; // HTTOP
    }
    bar.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0) return;
      if (tbIsChrome(ev.target)) return;
      ev.preventDefault();
      var rc = tbResizeCode(ev);
      if (rc) { tbShell('win|resize|' + rc); return; }
      dragArmed = true; dragSent = false;
      dragX = ev.clientX; dragY = ev.clientY;
    });
    bar.addEventListener('mousemove', function (ev) {
      if (!dragArmed || dragSent) {
        // 悬停到上沿缩放带时给出 ns-resize 指针（原生上边框同款）
        bar.style.cursor = tbResizeCode(ev) ? 'ns-resize' : '';
        return;
      }
      if (Math.abs(ev.clientX - dragX) > 3 || Math.abs(ev.clientY - dragY) > 3) {
        dragSent = true;
        bar.style.cursor = '';
        tbShell('win|drag');
      }
    });
    /* 2026-10-17 老王：右键标题栏要出 Windows 那套（还原/移动/大小/最小化/最大化/关闭），
       而不是 WebView 自带的浏览器菜单 → 屏蔽默认菜单，改由壳层弹原生系统菜单。 */
    bar.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      if (openId) closeAll();
      tbShell('win|sysmenu');
    });
    window.addEventListener('mouseup', function () { dragArmed = false; });
    bar.addEventListener('click', function (ev) {
      if (tbIsChrome(ev.target)) return;
      var now = Date.now();
      if (now - lastBarClick < 400) {
        lastBarClick = 0;
        tbShell('win|maximize-toggle');
        return;
      }
      lastBarClick = now;
    });
    // 窗口按钮（自绘，替代被 WebView2 盖住的原生 Caption 按钮）
    var btnMin = document.getElementById('tb-btn-min');
    var btnMax = document.getElementById('tb-btn-max');
    var btnClose = document.getElementById('tb-btn-close');
    if (btnMin) btnMin.addEventListener('click', function (ev) { ev.stopPropagation(); tbShell('win|minimize'); });
    if (btnMax) btnMax.addEventListener('click', function (ev) { ev.stopPropagation(); tbShell('win|maximize-toggle'); });
    if (btnClose) btnClose.addEventListener('click', function (ev) { ev.stopPropagation(); tbShell('win|close'); });
    // 页面弹窗：右上角 × / 点遮罩关闭（Esc 见下方 keydown）
    var btnPageClose = document.getElementById('tb-page-close');
    if (btnPageClose) btnPageClose.addEventListener('click', function (ev) { ev.stopPropagation(); closePagePopup(); });
    var pageOverlay = document.getElementById('tb-page-overlay');
    if (pageOverlay) pageOverlay.addEventListener('mousedown', function (ev) {
      if (ev.target === pageOverlay) closePagePopup();
    });
    // 点菜单 / 下拉之外（含条带空白）收起；Esc 收起。
    document.addEventListener('mousedown', function (ev) {
      if (!openId) return;
      var t = ev.target;
      if (t && t.closest && t.closest('.tb-menu, .tb-pop')) return;
      closeAll();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        if (openId) { closeAll(); return; }
        if (pagePopupOpen) closePagePopup();
      }
    });
    window.addEventListener('studio-lang-change', renderLabels);
    renderLabels();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
